<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HonestPDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══ Title Bar ═══ -->
<div class="titlebar">
  <div class="titlebar-brand">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M5 5h6M5 8h4M5 11h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    HonestPDF
  </div>
  <div class="titlebar-sep"></div>
  <div class="titlebar-search">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search tools…" autocomplete="off" spellcheck="false">
  </div>
  <div class="titlebar-right">
    <span style="font-size:11px;color:#444;font-weight:400">by <a href="#" onclick="require('electron').shell.openExternal('https://github.com/SumitkCodes');return false" style="color:#666;text-decoration:none;font-weight:500">Sumit Das</a></span>
  </div>
</div>

<!-- ═══ Category Tabs ═══ -->
<div class="category-bar" id="categoryBar">
  <button class="cat-tab active" data-cat="all">All Tools</button>
  <button class="cat-tab" data-cat="operations">Modify</button>
  <button class="cat-tab" data-cat="fromPdf">Export</button>
  <button class="cat-tab" data-cat="toPdf">Import</button>
  <button class="cat-tab" data-cat="security">Security</button>
  <button class="cat-tab" data-cat="enhance">Annotate</button>
  <button class="cat-tab" data-cat="advanced">Advanced</button>
</div>

<!-- ═══ Main ═══ -->
<div class="main" id="mainContent">

  <!-- Dashboard -->
  <div class="dashboard" id="dashboardView">
    <div id="toolSections"></div>
  </div>

  <!-- Tool -->
  <div class="tool-view hidden" id="toolView">
    <div class="tv-header">
      <button class="tv-back" id="backBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div>
        <div class="tv-title" id="toolTitle"></div>
        <div class="tv-desc" id="toolDescription"></div>
      </div>
    </div>
    <div id="toolBody"></div>
  </div>

</div>

<!-- Toasts -->
<div class="toast-container" id="toastContainer"></div>

<!-- Loading -->
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner">
    <div class="spinner-ring"></div>
    <p class="loading-text" id="loadingText">Processing…</p>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
